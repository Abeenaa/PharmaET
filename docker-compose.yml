version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: pharmaEt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pharmaet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pharmaet-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pharmaet.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - pharmaet-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  pharmaet-network:
    driver: bridge
